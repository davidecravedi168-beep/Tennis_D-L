name: Premium Brand Assets
on:
  push:
    branches: [main]
    paths: ['assets/brand-premium.svg','.github/workflows/premium-brand-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check cairosvg
      - name: Render iOS Android and favicon assets
        run: |
          python - <<'PY'
          import cairosvg
          src='assets/brand-premium.svg'
          for size,name in [(180,'icons/apple-touch-icon.png'),(192,'icons/icon-192.png'),(512,'icons/icon-512.png'),(32,'icons/favicon-32.png')]:
              cairosvg.svg2png(url=src,write_to=name,output_width=size,output_height=size)
          PY
      - run: file icons/*.png && test -s icons/icon-512.png
      - name: Commit rendered assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icons/
          git diff --cached --quiet || (git commit -m 'feat: apply premium Tennis identity' && git push)
