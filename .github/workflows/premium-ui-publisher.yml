name: Premium UI Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-ui-publisher.yml'
      - 'premium-shell-v1.js'
      - 'player-photos.js'
      - 'scripts/apply-refresh-resilience.mjs'
      - 'index.html'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-ui-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize premium V3.8 assets
        run: |
          set -euo pipefail
          node scripts/apply-refresh-resilience.mjs
          node scripts/apply-refresh-resilience.mjs

      - name: Validate V3.8 contracts
        run: |
          set -euo pipefail
          node --check premium-shell-v1.js
          node --check player-photos.js
          grep -Fq 'player-photos.js?v=20260912-v36-verified' index.html
          grep -Fq 'premium-shell-v1.js?v=20260912-v39-nav-fix' index.html
          grep -Fq '"start_url": "./?v=20260912-v39-nav-fix"' manifest.webmanifest
          grep -Fq 'TEP_FULL_PREMIUM_UI_V3_8' premium-shell-v1.js
          grep -Fq 'TEP_IOS_NAV_BIND_V38' premium-shell-v1.js
          grep -Fq "photoKey='tep:premium:photos:v32-verified'" premium-shell-v1.js
          grep -Fq 'Fail closed: a portrait is shown only when the curated catalog' premium-shell-v1.js
          ! grep -Fq 'wikipedia.org/api' premium-shell-v1.js
          ! grep -Fq 'wikidata.org/w/api' premium-shell-v1.js
          ! grep -Fq '"xinran sun"' player-photos.js
          grep -Fq "const nodes=\$\$('[data-photo]',root).filter(" premium-shell-v1.js
          grep -Fq "\$\$('.tp-nav [data-route]').forEach" premium-shell-v1.js
          grep -Fq "el.addEventListener('touchend'" premium-shell-v1.js
          grep -Fq "el.addEventListener('click'" premium-shell-v1.js
          grep -Fq 'TEP_LEGACY_NAV_BRIDGE_V39' premium-shell-v1.js
          grep -Fq 'const LEGACY_ROUTE=' premium-shell-v1.js
          grep -Fq "state.screen==='bankroll'?bankrollScreen()" premium-shell-v1.js
          ! grep -Fq '$$$(' premium-shell-v1.js
          ! grep -Fq 'https://thumb.wikimedia.org/' player-photos.js
          ! grep -Fq 'document.startViewTransition' premium-shell-v1.js
          ! grep -Fq '[object Object]' premium-shell-v1.js
          test "$(grep -o 'player-photos.js?v=20260912-v36-verified' index.html | wc -l)" -eq 1
          test "$(grep -o 'premium-shell-v1.js?v=20260912-v39-nav-fix' index.html | wc -l)" -eq 1
          echo 'PREMIUM_V38_CONTRACT=PASS'

      - name: Real browser local UX smoke
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo CHROME_NOT_FOUND; exit 1; }
          cat > ux-probe.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"></head><body><iframe id="app" style="width:390px;height:844px"></iframe><script>
          const f=document.getElementById('app');
          f.onload=()=>{
            const w=f.contentWindow,d=f.contentDocument,start=performance.now();
            const portrait=()=>{
              const good=[...d.querySelectorAll('.tp-avatar.hero img')].find(x=>x.complete&&x.naturalWidth>40&&x.naturalHeight>40&&x.closest('.tp-avatar')?.classList.contains('has-photo'));
              const fallback=[...d.querySelectorAll('.tp-avatar.hero[data-avatar-fallback=initials]')].some(x=>(x.querySelector('span')?.textContent||'').trim().length>=2);
              if(good||fallback){document.documentElement.dataset.portrait='pass';document.documentElement.dataset.portraitKind=good?'photo':'initials';nav();return}
              if(performance.now()-start<12000)setTimeout(portrait,80);else{document.documentElement.dataset.portrait='fail';nav();}
            };
            const legacyNav=async()=>{
              const cases=[['live','Live'],['matches','Partite'],['record','Track Record'],['bankroll','Bankroll'],['bets','']];
              const waitFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
              const checks=[];
              for(const [go,title] of cases){
                const el=d.querySelector(`.bottomNav .nav[data-go="${go}"]`);
                if(!el){checks.push(false);continue}
                el.click();await waitFrame();
                const current=d.querySelector('#tpView h1')?.textContent?.trim()||'';
                const home=go==='bets'?(d.querySelector('#tpView .tp-kicker span')?.textContent?.trim()==='MATCH IN EVIDENZA'):current===title;
                checks.push(Boolean(home&&el.classList.contains('active')));
              }
              document.documentElement.dataset.legacyNav=checks.every(Boolean)?'pass':'fail';
            };
            const nav=()=>{
              const b=d.querySelector('.tp-nav [data-route="explore"]');
              if(!b){if(performance.now()-start<8000)return setTimeout(nav,80);document.documentElement.dataset.nav='fail';return}
              const t=performance.now();
              b.click();
              requestAnimationFrame(()=>requestAnimationFrame(()=>{
                const title=d.querySelector('.tp-page-title h1')?.textContent?.trim(),ms=performance.now()-t;
                document.documentElement.dataset.nav=title==='Partite'&&ms<180?'pass':'fail';
                document.documentElement.dataset.navMs=ms.toFixed(1);
                legacyNav();
              }));
            };
            portrait();
          };
          f.src='./?v=v38-local';
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tep-v38-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep .25; done
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom 'http://127.0.0.1:8765/ux-probe.html' >/tmp/ux.html
          grep -Eo '<html[^>]*data-(portrait|nav)[^>]*>' /tmp/ux.html | head -1 || true
          grep -Eq '<html[^>]*data-portrait="pass"' /tmp/ux.html
          grep -Eq '<html[^>]*data-nav="pass"' /tmp/ux.html
          grep -Eq '<html[^>]*data-legacy-nav="pass"' /tmp/ux.html
          echo 'PREMIUM_V38_LOCAL_BROWSER=PASS'

      - name: Existing quant regressions
        run: |
          set -euo pipefail
          node scripts/tennis-model-diagnostics-v2.mjs --self-test
          node scripts/drift-controller-v6.mjs --self-test
          node scripts/clv-tracker-v3.mjs --self-test
          node scripts/clv-diagnostics-fix-v3.mjs --self-test
          node scripts/clv-evidence-v4.mjs --self-test

      - name: Commit normalized V3.8 assets if needed
        run: |
          set -euo pipefail
          rm -f ux-probe.html
          if git diff --quiet -- premium-shell-v1.js player-photos.js index.html manifest.webmanifest; then
            echo 'Premium V3.8 already normalized.'
          else
            git config user.name 'tennis-edge-ui-publisher'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add premium-shell-v1.js player-photos.js index.html manifest.webmanifest
            git commit -m 'fix(ui): normalize V3.8 navigation and portrait runtime'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Public Pages V3.8 browser smoke
        run: |
          set -euo pipefail
          PUBLIC='https://davidecravedi168-beep.github.io/Tennis_D-L/'
          CACHE_BUST="v38-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for i in {1..60}; do
            if curl -fsSL "${PUBLIC}?v=${CACHE_BUST}" -o /tmp/public-index.html \
              && grep -Fq 'player-photos.js?v=20260912-v36-verified' /tmp/public-index.html \
              && grep -Fq 'premium-shell-v1.js?v=20260912-v39-nav-fix' /tmp/public-index.html; then
              echo 'PUBLIC_V38_SHELL_FRESH=PASS'; break
            fi
            if [ "$i" -eq 60 ]; then echo PUBLIC_V38_SHELL_FRESH=FAIL; exit 1; fi
            sleep 5
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          timeout 80s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=24000 --dump-dom "${PUBLIC}?v=${CACHE_BUST}#tp-explore" >/tmp/public-v38.html
          echo "VERSION=$(grep -c 'data-version=\"TEP_FULL_PREMIUM_UI_V3_8\"' /tmp/public-v38.html || true)"
          echo "PARTITE=$(grep -c '>Partite<' /tmp/public-v38.html || true)"
          grep -Fq 'data-version="TEP_FULL_PREMIUM_UI_V3_8"' /tmp/public-v38.html
          grep -Fq '>Partite<' /tmp/public-v38.html
          echo 'PUBLIC_PREMIUM_V38=PASS'
