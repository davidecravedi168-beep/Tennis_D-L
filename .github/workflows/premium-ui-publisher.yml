name: Premium UI Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-ui-publisher.yml'
      - 'premium-shell-v1.js'
      - 'scripts/apply-refresh-resilience.mjs'
      - 'index.html'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-ui-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize premium V3.2 portrait wiring
        run: |
          set -euo pipefail
          node scripts/apply-refresh-resilience.mjs
          node scripts/apply-refresh-resilience.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          s = re.sub(r'premium-shell-v1\.js\?v=[^"\']+', 'premium-shell-v1.js?v=20260911-v32-player-portraits', s)
          p.write_text(s, encoding='utf-8')

          m = Path('manifest.webmanifest')
          ms = m.read_text(encoding='utf-8')
          ms = re.sub(r'"start_url"\s*:\s*"\.\/\?v=[^"]+"', '"start_url": "./?v=20260911-v32-player-portraits"', ms)
          m.write_text(ms, encoding='utf-8')
          PY

      - name: Validate premium V3.2 portrait wiring
        run: |
          set -euo pipefail
          node --check premium-shell-v1.js
          grep -Fq 'premium-shell-v1.js?v=20260911-v32-player-portraits' index.html
          grep -Fq '"start_url": "./?v=20260911-v32-player-portraits"' manifest.webmanifest
          grep -Fq "connect-src 'self' https://en.wikipedia.org;" index.html
          grep -Fq "img-src 'self' data: https://commons.wikimedia.org https://upload.wikimedia.org;" index.html
          grep -Fq 'TEP_FULL_PREMIUM_UI_V3_1' premium-shell-v1.js
          grep -Fq 'function liveScore(score)' premium-shell-v1.js
          grep -Fq 'document.startViewTransition' premium-shell-v1.js
          grep -Fq 'generator=search' premium-shell-v1.js
          grep -Fq "const nodes=\$\$('[data-photo]',root).filter" premium-shell-v1.js
          grep -Fq '.tp-avatar.has-photo img{opacity:1}' premium-shell-v1.js
          test "$(grep -o 'premium-shell-v1.js?v=20260911-v32-player-portraits' index.html | wc -l)" -eq 1
          if grep -Fq '[object Object]' premium-shell-v1.js; then
            echo 'OBJECT_STRING_LEAK_FOUND'
            exit 1
          fi
          echo 'PREMIUM_V32_CONTRACT=PASS'

      - name: Real browser local smoke
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'CHROME_NOT_FOUND'; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tep-premium-prod-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep .25; done
          timeout 60s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom 'http://127.0.0.1:8765/?v=20260911-v32-player-portraits' > /tmp/tep-premium-prod-dom.html
          grep -Fq 'data-version="TEP_FULL_PREMIUM_UI_V3_1"' /tmp/tep-premium-prod-dom.html
          grep -Fq 'class="tp-winband"' /tmp/tep-premium-prod-dom.html
          grep -Fq 'PROBABILITÀ DI VITTORIA' /tmp/tep-premium-prod-dom.html
          grep -Fq 'Partite in arrivo' /tmp/tep-premium-prod-dom.html
          grep -Fq 'Le Mie Analisi' /tmp/tep-premium-prod-dom.html
          grep -Fq 'tp-nav' /tmp/tep-premium-prod-dom.html
          grep -Eq 'class="tp-avatar hero[^\"]*has-photo|class="tp-avatar[^\"]*has-photo[^\"]*hero' /tmp/tep-premium-prod-dom.html
          grep -Eq 'src="https://(upload|commons)\.wikimedia\.org/' /tmp/tep-premium-prod-dom.html
          echo 'PREMIUM_V32_LOCAL_BROWSER=PASS'

      - name: Existing quant regressions
        run: |
          set -euo pipefail
          node scripts/tennis-model-diagnostics-v2.mjs --self-test
          node scripts/drift-controller-v6.mjs --self-test
          node scripts/clv-tracker-v3.mjs --self-test
          node scripts/clv-diagnostics-fix-v3.mjs --self-test

      - name: Commit normalized wiring if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html manifest.webmanifest; then
            echo 'Premium V3.2 portrait shell already wired.'
          else
            git config user.name 'tennis-edge-ui-publisher'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html manifest.webmanifest
            git commit -m 'fix(ui): activate V3.2 player portrait shell'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Public Pages browser smoke
        run: |
          set -euo pipefail
          PUBLIC='https://davidecravedi168-beep.github.io/Tennis_D-L/'
          CACHE_BUST="v32-portraits-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for i in {1..48}; do
            if curl -fsSL "${PUBLIC}?v=${CACHE_BUST}" -o /tmp/public-premium-index.html \
              && grep -Fq 'premium-shell-v1.js?v=20260911-v32-player-portraits' /tmp/public-premium-index.html; then
              echo 'PUBLIC_PREMIUM_V32_SHELL_FRESH=PASS'
              break
            fi
            if [ "$i" -eq 48 ]; then
              echo 'PUBLIC_PREMIUM_V32_SHELL_FRESH=FAIL'
              exit 1
            fi
            sleep 5
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'CHROME_NOT_FOUND'; exit 1; }
          timeout 70s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=22000 --dump-dom "${PUBLIC}?v=${CACHE_BUST}" > /tmp/public-premium-dom.html
          grep -Fq 'data-version="TEP_FULL_PREMIUM_UI_V3_1"' /tmp/public-premium-dom.html
          grep -Fq 'class="tp-winband"' /tmp/public-premium-dom.html
          grep -Fq 'PROBABILITÀ DI VITTORIA' /tmp/public-premium-dom.html
          grep -Fq 'Partite in arrivo' /tmp/public-premium-dom.html
          grep -Fq 'Le Mie Analisi' /tmp/public-premium-dom.html
          grep -Fq 'tp-nav' /tmp/public-premium-dom.html
          grep -Eq 'class="tp-avatar hero[^\"]*has-photo|class="tp-avatar[^\"]*has-photo[^\"]*hero' /tmp/public-premium-dom.html
          grep -Eq 'src="https://(upload|commons)\.wikimedia\.org/' /tmp/public-premium-dom.html
          echo 'PUBLIC_PREMIUM_V32_PORTRAITS=PASS'
