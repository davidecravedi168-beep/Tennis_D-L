name: Tennis Edge Pro 12.5 Scheduler Watchdog
run-name: "TEP 12.5 · watchdog · ${{ github.event_name }}"

on:
  workflow_dispatch:
  schedule:
    # Independent scheduler identity, staggered from the primary workflow and away from the top of the hour.
    # The shared freshness gate prevents duplicate API work.
    - cron: "18,33,48 * * * *"

permissions:
  contents: write

jobs:
  stable-autopilot:
    uses: ./.github/workflows/tennis-quant-v2.yml
    secrets: inherit
