name: Tennis Edge Pro 12.5 Scheduler Watchdog
run-name: "TEP 12.5 · watchdog · ${{ github.event_name }}"

on:
  workflow_dispatch:
  schedule:
    # Independent scheduler identity, deliberately changed to force GitHub re-registration.
    # Staggered from the primary workflow and away from the top of the hour.
    - cron: "14,29,44 * * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

jobs:
  stable-autopilot:
    uses: ./.github/workflows/tennis-quant-v2.yml
    secrets: inherit
