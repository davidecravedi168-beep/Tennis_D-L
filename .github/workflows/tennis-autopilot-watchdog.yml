name: Tennis Edge Pro 12.5 Scheduler Watchdog
run-name: "TEP 12.5 · watchdog · ${{ github.event_name }}"

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; minutes are staggered from the primary workflow.
    - cron: "14,29,44 * * * *"

permissions:
  contents: write

jobs:
  stable-autopilot:
    uses: ./.github/workflows/tennis-quant-v2.yml
    with:
      source_event: ${{ github.event_name }}
      source_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
