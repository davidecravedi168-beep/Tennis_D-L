name: Tennis Edge Pro Challenger V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tennis-challenger-v3.yml"
      - "scripts/challenger-forward-ledger-v3.mjs"
      - "scripts/calibration-policy-v4.mjs"
      - "scripts/adaptive-calibration-v5.mjs"
      - "scripts/auto-calibration-trainer-v5.mjs"
      - "scripts/calibration-audit-v4.mjs"
      - "scripts/tennis-model-diagnostics-v2.mjs"
      - "scripts/drift-controller-v6.mjs"
      - "scripts/clv-tracker-v3.mjs"
      - "scripts/clv-diagnostics-fix-v3.mjs"
      - "scripts/clv-evidence-v4.mjs"
      - "scripts/statistical-learning-v7.mjs"
  schedule:
    - cron: "12,27,42,57 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-edge-pro-challenger-v3
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/calibration-policy-v4.mjs
          node --check scripts/adaptive-calibration-v5.mjs
          node --check scripts/auto-calibration-trainer-v5.mjs
          node --check scripts/calibration-audit-v4.mjs
          node --check scripts/challenger-forward-ledger-v3.mjs
          node --check scripts/tennis-model-diagnostics-v2.mjs
          node --check scripts/drift-controller-v6.mjs
          node --check scripts/clv-tracker-v3.mjs
          node --check scripts/clv-diagnostics-fix-v3.mjs
          node --check scripts/clv-evidence-v4.mjs
          node --check scripts/statistical-learning-v7.mjs

          # The classifier self-test must verify rules, not depend on the mutable
          # production calibration model. Run it against the frozen V4 fallback,
          # then restore the live model and smoke-test that separately.
          restore_model=0
          if [ -f data/calibration-model-v5.json ]; then
            mv data/calibration-model-v5.json /tmp/calibration-model-v5.json
            restore_model=1
          fi
          restore_calibration_model() {
            if [ "$restore_model" -eq 1 ] && [ -f /tmp/calibration-model-v5.json ]; then
              mv -f /tmp/calibration-model-v5.json data/calibration-model-v5.json
            fi
          }
          trap restore_calibration_model EXIT
          node scripts/challenger-forward-ledger-v3.mjs --self-test
          restore_calibration_model
          restore_model=0
          trap - EXIT

          node --input-type=module <<'NODE'
          import {activeCalibration, calibrateProb} from './scripts/adaptive-calibration-v5.mjs';
          const state=activeCalibration();
          const p=calibrateProb(0.65,{tour:'ATP',odds:1.8});
          if(!Number.isFinite(p)||p<=0||p>=1) throw new Error('ACTIVE_CALIBRATION_INVALID');
          console.log(JSON.stringify({ok:true,active_calibration:state,probe:p}));
          NODE

          node scripts/tennis-model-diagnostics-v2.mjs --self-test
          node scripts/drift-controller-v6.mjs --self-test
          node scripts/clv-tracker-v3.mjs --self-test
          node scripts/clv-diagnostics-fix-v3.mjs --self-test
          node scripts/clv-evidence-v4.mjs --self-test
          node scripts/statistical-learning-v7.mjs --self-test
      - name: Capture real pre-start odds for CLV
        if: github.event_name != 'push'
        run: node scripts/clv-tracker-v3.mjs
      - name: Train guarded calibration candidate
        if: github.event_name != 'push'
        run: node scripts/auto-calibration-trainer-v5.mjs
      - name: Build calibrated drift policy
        if: github.event_name != 'push'
        run: node scripts/drift-controller-v6.mjs
      - name: Update Challenger V3 forward ledger
        if: github.event_name != 'push'
        run: node scripts/challenger-forward-ledger-v3.mjs
      - name: Build diagnostics and calibration audit
        if: github.event_name != 'push'
        run: |
          node scripts/drift-controller-v6.mjs
          node scripts/tennis-model-diagnostics-v2.mjs
          node scripts/tennis-model-diagnostics-v2.mjs --validate
          node scripts/clv-diagnostics-fix-v3.mjs
          node scripts/calibration-audit-v4.mjs
      - name: Train statistical learning V7 in shadow mode
        if: github.event_name != 'push'
        run: |
          node scripts/statistical-learning-v7.mjs
          node scripts/statistical-learning-v7.mjs --validate
      - name: Commit evaluation state
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          files=(data/calibration-model-v5.json data/calibration-training-v5.json data/drift-controller-v6.json data/clv-tracker-v3.json data/challenger-forward-ledger-v3.json data/tennis-model-diagnostics-v2.json data/calibration-audit-v4.json data/statistical-learning-v7.json)
          existing=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ "${#existing[@]}" -eq 0 ]; then echo "No challenger state files found"; exit 0; fi
          git add -- "${existing[@]}"
          if git diff --cached --quiet; then echo "No challenger state changes"; exit 0; fi
          git config user.name "tennis-edge-challenger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update adaptive calibration, CLV integrity and Challenger evaluation"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
      - name: Summary
        if: always()
        run: |
          echo "### Tennis Edge Pro · Adaptive Calibration V5 + Drift Controller V6 + CLV V3" >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('fs');if(fs.existsSync('data/calibration-training-v5.json')){const x=JSON.parse(fs.readFileSync('data/calibration-training-v5.json'));console.log('- Auto-ML: '+x.status+' · settled '+x.settled_n+' · holdout '+(x.holdout_n||0))}" >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('fs');if(fs.existsSync('data/drift-controller-v6.json')){const x=JSON.parse(fs.readFileSync('data/drift-controller-v6.json'));console.log('- Drift controller: '+x.mode+' · raw '+(x.raw?.state||'NA')+' · calibrated '+(x.calibrated?.state||'NA')+' · min EV '+((x.decision_policy?.min_calibrated_ev||0)*100).toFixed(1)+'%')}" >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('fs');if(fs.existsSync('data/tennis-model-diagnostics-v2.json')){const x=JSON.parse(fs.readFileSync('data/tennis-model-diagnostics-v2.json'));console.log('- Drift: '+x.drift.state+' · CLV: '+x.clv.state+' · coverage '+((x.clv.coverage||0)*100).toFixed(1)+'% · provider '+(x.clv.provider_closing_sample||0)+' · proxy '+(x.clv.proxy_closing_sample||0))}" >> "$GITHUB_STEP_SUMMARY"
          node -e "const fs=require('fs');if(fs.existsSync('data/statistical-learning-v7.json')){const x=JSON.parse(fs.readFileSync('data/statistical-learning-v7.json'));const d=x.oos?.delta||{};console.log('- Statistical ML V7: OOS '+(x.oos?.n||0)+' · ΔBrier '+(Number.isFinite(d.brier)?d.brier.toFixed(4):'—')+' · ΔLogLoss '+(Number.isFinite(d.logloss)?d.logloss.toFixed(4):'—')+' · '+(x.promotion?.state||'HOLD')+' · drift '+(x.drift?.state||'NA'))}" >> "$GITHUB_STEP_SUMMARY"
