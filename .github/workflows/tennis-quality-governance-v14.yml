name: Tennis Quality Governance V14
on:
  push:
    branches: [main]
    paths:
      - 'tennis-quality-governance-v14.js'
      - 'scripts/upgrade_quality_governance_v14.py'
      - '.github/workflows/tennis-quality-governance-v14.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/upgrade_quality_governance_v14.py
      - run: node --check tennis-quality-governance-v14.js
      - run: |
          grep -q 'tennis-quality-governance-v14.js?v=14.0' index.html
          grep -q 'Quality & Validation Governance' tennis-quality-governance-v14.js
          git diff --check
      - if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Tennis Edge Pro V14 — wire quality governance'
          git push origin HEAD:main
