name: Tennis Quant V2

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: tennis-quant-v2
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Zero Cost Quant
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node quant-engine.mjs

      - name: Save quant data safely
        shell: bash
        run: |
          set -e

          cp data/quant-board.json /tmp/quant-board.json

          git config user.name "tennis-zero-cost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp /tmp/quant-board.json data/quant-board.json

            git add data/quant-board.json

            if git diff --cached --quiet; then
              echo "Quant data already updated"
              exit 0
            fi

            git commit -m "quant: update autonomous data"

            if git push origin HEAD:main; then
              echo "SUCCESS"
              exit 0
            fi

            sleep 3
          done

          exit 1
