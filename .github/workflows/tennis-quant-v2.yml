name: Tennis Zero Cost Quant

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */2 * * *"

permissions:
  contents: write

concurrency:
  group: tennis-zero-cost-quant
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Engine self-test
        run: node quant-engine.mjs --self-test

      - name: Run Zero Cost Quant
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node quant-engine.mjs

      - name: Commit state
        run: |
          if git diff --quiet -- data/quant-board.json; then
            echo "No quant changes"
            exit 0
          fi
          git config user.name "tennis-zero-cost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant-board.json
          git commit -m "quant: autonomous zero-cost update"
          git push
