name: Tennis Edge Pro 12.5 Stable Autopilot
run-name: "TEP 12.5 · ${{ github.event_name }} · ${{ github.event.schedule || 'manual' }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tennis-quant-v2.yml"
      - "quant-engine.mjs"
      - "live-engine.mjs"
      - "index.html"
      - "scripts/**"
      - "data/scheduler-kick.txt"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_event:
        description: "Original caller event (schedule/manual)"
        required: false
        type: string
        default: ""
      source_schedule:
        description: "Original caller cron expression"
        required: false
        type: string
        default: ""
  schedule:
    # GitHub Actions cron is UTC. Minutes are intentionally off-peak.
    # No timezone key: GitHub does not support it in workflow schedule syntax.
    - cron: "07,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-edge-pro-stable-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Scheduler freshness gate
        id: gate
        env:
          GH_EVENT_NAME: ${{ inputs.source_event || github.event_name }}
          GH_EVENT_SCHEDULE: ${{ inputs.source_schedule || github.event.schedule }}
        run: node scripts/scheduler-gate.mjs

      - name: Source and app contract tests
        run: |
          node --check quant-engine.mjs
          node --check live-engine.mjs
          node --check scripts/forward-ledger.mjs
          node --check scripts/legacy-forward-audit.mjs
          node quant-engine.mjs --self-test
          node live-engine.mjs --self-test
          node scripts/forward-ledger.mjs --self-test
          node scripts/legacy-forward-audit.mjs --self-test
          node scripts/validate-app.mjs

      - name: Run Quant Engine
        if: steps.gate.outputs.run_quant == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COMMERCIAL_MODE: ${{ vars.COMMERCIAL_MODE }}
          COMMERCIAL_ODDS_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_ODDS_LICENSE_CONFIRMED }}
          COMMERCIAL_HISTORY_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_HISTORY_LICENSE_CONFIRMED }}
          ATP_HISTORY_URL_TEMPLATE: ${{ vars.ATP_HISTORY_URL_TEMPLATE }}
          WTA_HISTORY_URL_TEMPLATE: ${{ vars.WTA_HISTORY_URL_TEMPLATE }}
        run: node quant-engine.mjs

      - name: Validate Quant Board
        if: steps.gate.outputs.run_quant == 'true'
        run: node scripts/validate-board.mjs quant

      - name: Run Live Engine
        if: steps.gate.outputs.run_live == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COMMERCIAL_MODE: ${{ vars.COMMERCIAL_MODE }}
          COMMERCIAL_ODDS_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_ODDS_LICENSE_CONFIRMED }}
        run: node live-engine.mjs

      - name: Validate Live Board
        if: steps.gate.outputs.run_live == 'true'
        run: node scripts/validate-board.mjs live

      - name: Stamp automation health
        env:
          GH_EVENT_NAME: ${{ inputs.source_event || github.event_name }}
          GH_EVENT_SCHEDULE: ${{ inputs.source_schedule || github.event.schedule }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_QUANT: ${{ steps.gate.outputs.run_quant }}
          RUN_LIVE: ${{ steps.gate.outputs.run_live }}
          QUANT_REASON: ${{ steps.gate.outputs.quant_reason }}
          LIVE_REASON: ${{ steps.gate.outputs.live_reason }}
        run: node scripts/stamp-automation.mjs

      - name: Final publish validation
        run: |
          node scripts/validate-board.mjs quant
          node scripts/validate-board.mjs live

      - name: Update immutable forward ledger
        run: |
          node scripts/forward-ledger.mjs
          node scripts/forward-ledger.mjs --validate

      - name: Build forensic legacy forward audit
        run: |
          node scripts/legacy-forward-audit.mjs
          node scripts/legacy-forward-audit.mjs --validate

      - name: Commit validated state
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- data/quant-board.json data/quant-state.json data/live-board.json data/automation-health.json data/forward-ledger.json data/legacy-forward-audit.json
          if git diff --cached --quiet; then
            echo "No validated state changes"
            exit 0
          fi
          git config user.name "tennis-edge-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: TEP 12.5 validated autopilot refresh"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run summary
        if: always()
        shell: bash
        env:
          RUN_QUANT: ${{ steps.gate.outputs.run_quant }}
          RUN_LIVE: ${{ steps.gate.outputs.run_live }}
          QUANT_REASON: ${{ steps.gate.outputs.quant_reason }}
          LIVE_REASON: ${{ steps.gate.outputs.live_reason }}
        run: |
          echo "### Tennis Edge Pro 12.5 Autopilot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quant: ${RUN_QUANT:-unknown} · ${QUANT_REASON:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live: ${RUN_LIVE:-unknown} · ${LIVE_REASON:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scheduler source event: ${{ inputs.source_event || github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/forward-ledger.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/forward-ledger.json','utf8'));
          const s=x.stats||{};
          console.log(`- Forward ledger: ${s.total_forecasts??0} forecast · ${s.settled_forecasts??0} settled · ${s.settled_picks??0} pick`);
          console.log(`- Next audit: ${s.next_audit_target??100} · remaining ${s.forecasts_to_next_audit??100}`);
          NODE
          fi
          if [ -f data/legacy-forward-audit.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/legacy-forward-audit.json','utf8'));
          const s=x.stats||{};
          const pct=v=>Number.isFinite(v)?`${(v*100).toFixed(1)}%`:'—';
          console.log(`- Legacy verified: ${s.verified_forecasts??0} forecast · ${s.settled_verified??0} settled · accuracy ${pct(s.accuracy)}`);
          console.log(`- Legacy Brier: ${Number.isFinite(s.brier)?s.brier.toFixed(4):'—'} · original qualified picks ${s.qualified_picks??0} · ROI ${pct(s.roi)}`);
          NODE
          fi
