name: Tennis Edge Pro 12.5 Native Schedule Certifier
run-name: "TEP 12.5 Scheduler Certifier · ${{ github.event_name }} · ${{ github.event.schedule || 'manual' }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tennis-schedule-certifier.yml"
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC; this independent identity certifies native scheduling.
    - cron: "13,28,43,58 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-edge-pro-native-schedule-certifier
  cancel-in-progress: false

jobs:
  autopilot:
    uses: ./.github/workflows/tennis-quant-v2.yml
    with:
      source_event: ${{ github.event_name }}
      source_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
