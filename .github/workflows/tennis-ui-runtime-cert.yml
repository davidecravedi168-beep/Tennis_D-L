name: Tennis UI Runtime Certifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-ui-runtime-cert.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'tennis-quant-math-v13.js'
      - 'tennis-quant-lab-v13.js'
      - 'tennis-quality-governance-v14.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair CSP for same-origin runtime modules
        id: repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "script-src 'unsafe-inline';"
          new = "script-src 'self' 'unsafe-inline';"
          changed = False
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              changed = True
          if new not in s:
              raise SystemExit('CSP_SELF_SCRIPT_MISSING')
          print('CSP runtime policy:', 'repaired' if changed else 'already-correct')
          PY

      - name: Runtime contract tests
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "script-src 'self' 'unsafe-inline';" index.html
          grep -Fq 'tennis-quant-math-v13.js?v=13.0' index.html
          grep -Fq 'tennis-quant-lab-v13.js?v=13.2-pro-metrics-premium-20260911' index.html
          grep -Fq 'tennis-quality-governance-v14.js?v=14.0' index.html
          grep -Fq './?v=20260911-pro-metrics-premium-r3' manifest.webmanifest
          grep -Fq 'PRO METRICS' tennis-quant-lab-v13.js
          grep -Fq 'Advanced match intelligence' tennis-quant-lab-v13.js
          grep -Fq 'Giochi totali / Over-Under' tennis-quant-lab-v13.js
          grep -Fq 'Profilo servizio' tennis-quant-lab-v13.js
          grep -Fq 'Set decisivo & tie-break' tennis-quant-lab-v13.js
          grep -Fq 'function decorateMatches()' tennis-quant-lab-v13.js
          node --check tennis-quant-math-v13.js
          node --check tennis-quant-lab-v13.js
          node --check tennis-quality-governance-v14.js
          echo 'UI_RUNTIME_CERT=PASS'

      - name: Real browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo 'CHROME_NOT_FOUND'; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tep-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 0.25
          done
          timeout 40s "$CHROME" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=9000 \
            --dump-dom \
            'http://127.0.0.1:8765/?v=20260911-pro-metrics-premium-r3' > /tmp/tep-dom.html
          grep -Fq 'PRO METRICS' /tmp/tep-dom.html
          grep -Fq 'Advanced match intelligence' /tmp/tep-dom.html
          grep -Fq 'Giochi totali / Over-Under' /tmp/tep-dom.html
          grep -Fq 'Profilo servizio' /tmp/tep-dom.html
          grep -Fq 'Set decisivo &amp; tie-break' /tmp/tep-dom.html || grep -Fq 'Set decisivo & tie-break' /tmp/tep-dom.html
          grep -Fq 'tepProMetrics' /tmp/tep-dom.html
          grep -Fq 'Quant Math Lab · Tennis' /tmp/tep-dom.html
          echo 'UI_BROWSER_SMOKE=PASS'

      - name: Public Pages cache-busted smoke test
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC="https://davidecravedi168-beep.github.io/Tennis_D-L/"
          CACHE_BUST="premium-r3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for i in {1..48}; do
            if curl -fsSL "${PUBLIC}?v=${CACHE_BUST}" -o /tmp/public-index.html \
              && grep -Fq "script-src 'self' 'unsafe-inline';" /tmp/public-index.html \
              && grep -Fq 'tennis-quant-lab-v13.js?v=13.2-pro-metrics-premium-20260911' /tmp/public-index.html; then
              echo 'PUBLIC_SHELL_FRESH=PASS'
              break
            fi
            if [ "$i" -eq 48 ]; then
              echo 'PUBLIC_SHELL_FRESH=FAIL'
              exit 1
            fi
            sleep 5
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          timeout 45s "$CHROME" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom \
            "${PUBLIC}?v=${CACHE_BUST}" > /tmp/public-dom.html
          grep -Fq 'PRO METRICS' /tmp/public-dom.html
          grep -Fq 'Advanced match intelligence' /tmp/public-dom.html
          grep -Fq 'Giochi totali / Over-Under' /tmp/public-dom.html
          grep -Fq 'Profilo servizio' /tmp/public-dom.html
          grep -Fq 'Set decisivo &amp; tie-break' /tmp/public-dom.html || grep -Fq 'Set decisivo & tie-break' /tmp/public-dom.html
          grep -Fq 'tepProMetrics' /tmp/public-dom.html
          grep -Fq 'Quant Math Lab · Tennis' /tmp/public-dom.html
          echo 'PUBLIC_UI_BROWSER_SMOKE=PASS'

      - name: Commit CSP repair if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No CSP repair commit needed.'
            exit 0
          fi
          git config user.name 'tennis-edge-ui-certifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(ui): allow same-origin runtime modules under CSP'
          git pull --rebase origin main
          git push origin HEAD:main
