name: Tennis UI Runtime Certifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennis-ui-runtime-cert.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'premium-shell-v1.js'
      - 'player-photos.js'
      - 'scripts/apply-refresh-resilience.mjs'
      - 'tennis-quant-math-v13.js'
      - 'tennis-quant-lab-v13.js'
      - 'tennis-quality-governance-v14.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Runtime contracts
        run: |
          set -euo pipefail
          node scripts/apply-refresh-resilience.mjs
          node scripts/apply-refresh-resilience.mjs
          grep -Fq "script-src 'self' 'unsafe-inline';" index.html
          grep -Fq 'player-photos.js?v=20260912-v36-verified' index.html
          grep -Fq 'premium-shell-v1.js?v=20260911-v38-nav-runtime' index.html
          grep -Fq 'TEP_FULL_PREMIUM_UI_V3_8' premium-shell-v1.js
          grep -Fq 'function catalogPhoto(raw)' premium-shell-v1.js
          grep -Fq "photoKey='tep:premium:photos:v32-verified'" premium-shell-v1.js
          grep -Fq 'Fail closed: a portrait is shown only when the curated catalog' premium-shell-v1.js
          ! grep -Fq 'wikipedia.org/api' premium-shell-v1.js
          ! grep -Fq 'wikidata.org/w/api' premium-shell-v1.js
          ! grep -Fq '"xinran sun"' player-photos.js
          grep -Fq 'TEP_IOS_NAV_BIND_V38' premium-shell-v1.js
          grep -Fq "\$\$('.tp-nav [data-route]').forEach" premium-shell-v1.js
          grep -Fq "el.addEventListener('touchend'" premium-shell-v1.js
          grep -Fq "el.addEventListener('click'" premium-shell-v1.js
          ! grep -Fq 'document.startViewTransition' premium-shell-v1.js
          ! grep -Fq "behavior:'smooth'" premium-shell-v1.js
          ! grep -Fq '[object Object]' premium-shell-v1.js
          grep -Fq 'PROBABILITÀ DI VITTORIA' premium-shell-v1.js
          grep -Fq '<span>Partite</span>' premium-shell-v1.js
          grep -Fq '<span>Salvati</span>' premium-shell-v1.js
          node --check premium-shell-v1.js
          node --check player-photos.js
          node --check tennis-quant-math-v13.js
          node --check tennis-quant-lab-v13.js
          node --check tennis-quality-governance-v14.js
          node --check scripts/clv-evidence-v4.mjs
          node - <<'NODE'
          const fs=require('fs');
          const l=JSON.parse(fs.readFileSync('data/live-board.json','utf8'));
          if(!Array.isArray(l.events))throw new Error('LIVE_EVENTS_INVALID');
          const n=v=>v!==null&&v!==''&&Number.isFinite(Number(v))?Number(v):null;
          function score(s){if(s==null)return'LIVE';if(typeof s==='string'||typeof s==='number')return String(s);if(typeof s!=='object')return'LIVE';const sets=Array.isArray(s.sets)?s.sets.filter(x=>n(x?.home)!=null&&n(x?.away)!=null):[];const p=sets.map(x=>`${x.home}-${x.away}`);const cg=s?.raw?.periods?.currentgame;if(cg&&n(cg.home)!=null&&n(cg.away)!=null)p.push(`game ${cg.home}-${cg.away}`);if(p.length)return p.join(' · ');if(n(s.sets_home)!=null&&n(s.sets_away)!=null)return`${s.sets_home}-${s.sets_away}`;return'LIVE'}
          if(l.events.map(e=>score(e.score??e.current_score)).some(x=>x.includes('[object Object]')))throw new Error('OBJECT_SCORE_LEAK');
          console.log('LIVE_SCORE_CONTRACT=PASS events='+l.events.length);
          NODE
          echo 'UI_RUNTIME_CERT=PASS'

      - name: Real browser local smoke
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tep-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep .25; done
          timeout 65s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom 'http://127.0.0.1:8765/?v=v38-runtime' >/tmp/tep-dom.html
          grep -Fq 'data-version="TEP_FULL_PREMIUM_UI_V3_8"' /tmp/tep-dom.html
          grep -Fq 'MATCH IN EVIDENZA' /tmp/tep-dom.html
          grep -Fq '>Partite<' /tmp/tep-dom.html
          echo 'V38_LOCAL_RUNTIME_BROWSER=PASS'

      - name: Public Pages V3.8 smoke
        run: |
          set -euo pipefail
          PUBLIC='https://davidecravedi168-beep.github.io/Tennis_D-L/'
          BUST="runtime-v38-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for i in {1..60}; do
            if curl -fsSL "${PUBLIC}?v=${BUST}" -o /tmp/public-index.html \
              && grep -Fq 'player-photos.js?v=20260912-v36-verified' /tmp/public-index.html \
              && grep -Fq 'premium-shell-v1.js?v=20260911-v38-nav-runtime' /tmp/public-index.html; then break; fi
            if [ "$i" -eq 60 ]; then echo PUBLIC_V38_STALE; exit 1; fi
            sleep 5
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          timeout 75s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=22000 --dump-dom "${PUBLIC}?v=${BUST}" >/tmp/public-dom.html
          grep -Fq 'data-version="TEP_FULL_PREMIUM_UI_V3_8"' /tmp/public-dom.html
          grep -Fq 'MATCH IN EVIDENZA' /tmp/public-dom.html
          grep -Fq '>Partite<' /tmp/public-dom.html
          echo 'PUBLIC_V38_RUNTIME=PASS'

      - name: Existing quant regressions
        run: |
          set -euo pipefail
          node scripts/tennis-model-diagnostics-v2.mjs --self-test
          node scripts/drift-controller-v6.mjs --self-test
          node scripts/clv-tracker-v3.mjs --self-test
          node scripts/clv-diagnostics-fix-v3.mjs --self-test

      - name: Commit normalization if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'tennis-edge-ui-certifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(ui): normalize V3.8 runtime wiring'
          git pull --rebase origin main
          git push origin HEAD:main
