        run: node quant-engine.mjs
      - name: Stamp automation health
        if: steps.scheduler.outputs.run_quant == 'true'
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          SCHEDULER_ROLE: ${{ steps.scheduler.outputs.role }}
          SCHEDULER_REASON: ${{ steps.scheduler.outputs.reason }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),p='data/quant-board.json';
          if(!fs.existsSync(p))throw new Error('quant board missing after engine run');
          const q=JSON.parse(fs.readFileSync(p,'utf8'));
          q.meta=q.meta||{};
          q.meta.automation={
            checked_at:new Date().toISOString(),
            timezone:'Europe/Rome',
            event:process.env.GH_EVENT_NAME||null,
            schedule:process.env.GH_EVENT_SCHEDULE||null,
            role:process.env.SCHEDULER_ROLE||null,
            gate_reason:process.env.SCHEDULER_REASON||null,
            run_id:process.env.GH_RUN_ID||null,
            run_attempt:Number(process.env.GH_RUN_ATTEMPT||1),
            workflow_version:'12.4.1-AUTO-RECOVERY'
          };
          fs.writeFileSync(p,JSON.stringify(q,null,2)+'\n');
          console.log(JSON.stringify({ok:true,automation:q.meta.automation}));
          NODE
      - name: Quant Board fail-closed validation
        if: steps.scheduler.outputs.run_quant == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='data/quant-board.json';
          if(!fs.existsSync(p))throw new Error('quant board missing');
          const q=JSON.parse(fs.readFileSync(p));
          for(const k of ['upcoming','radar','history'])if(!Array.isArray(q[k]))throw new Error(k+' invalid');
          if(!Number.isFinite(new Date(q.meta?.updated_at).getTime()))throw new Error('updated_at invalid');
          const boardAgeMin=(Date.now()-new Date(q.meta.updated_at).getTime())/60000;if(boardAgeMin>20)throw new Error(`quant board stale after run: ${boardAgeMin.toFixed(1)}m`);
          if(!String(q.meta?.model_version||'').includes('12.4-PLAYER-INTEL'))throw new Error('V12.4 model patch not active');
          if(q.meta?.automation?.workflow_version!=='12.4.1-AUTO-RECOVERY')throw new Error('automation health stamp missing');
          const radar=q.radar||[],resolvedRadar=radar.filter(x=>String(x.pre_status||'').toUpperCase()!=='DATA GAP').length;
          const coverage=radar.length?resolvedRadar/radar.length:null;
          if(radar.length>=50&&resolvedRadar<5)throw new Error(`RADAR_COVERAGE_SYSTEMIC_GAP ${resolvedRadar}/${radar.length}`);
          const ids=new Set();
          const decimalOdds=v=>{if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return Number.isFinite(v)&&v>1?v:null;const s=String(v).trim();if(/^\+\d+(?:\.\d+)?$/.test(s))return 1+Number(s.slice(1))/100;if(/^-\d+(?:\.\d+)?$/.test(s))return 1+100/Math.abs(Number(s));if(/^\d+(?:\.\d+)?\/\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b>0?1+a/b:null}const x=Number(s);return Number.isFinite(x)&&x>1?x:null};
          for(const x of q.upcoming){
            const id=String(x.event_id||'');
            if(!id||ids.has(id))throw new Error('event id missing/duplicate: '+id);
            ids.add(id);
            if(!x.player_a||!x.player_b)throw new Error('players missing: '+id);
            if(x.locked&&(!x.player_intel?.a||!x.player_intel?.b))throw new Error('player_intel missing: '+id);
            if(x.locked&&x.player_intel?.candidate_side&&!['A','B'].includes(String(x.player_intel.candidate_side)))throw new Error('player_intel candidate side invalid: '+id);
            for(const p of [x.player_intel?.a,x.player_intel?.b].filter(Boolean)){
              if(!p.service||!p.return||!Array.isArray(p.recent_matches))throw new Error('player_intel contract invalid: '+id);
              for(const v of [p.service.first_serve_pct,p.service.first_serve_points_won,p.service.second_serve_points_won,p.service.service_games_won,p.return.first_return_points_won,p.return.second_return_points_won,p.return.return_games_won]){if(v!=null&&(!(Number(v)>=0)||Number(v)>1))throw new Error('player_intel percentage invalid: '+id)}
            }
            const rows=x.market_live?.rows?.length?x.market_live.rows:(x.market_lab?.priced||[]);
            for(const r of rows){
              const value=['VALUE','STRONG VALUE'].includes(String(r.verdict||'').toUpperCase());
              const prob=Number(r.robust_prob??r.model_prob??r.pick_prob);
              const odds=decimalOdds(r.current_odds??r.best_odds??r.pick_odds);
              const ev=Number(r.current_robust_ev??r.robust_ev??r.current_ev??r.pick_ev);
              if(value&&(!(prob>0&&prob<1)||!(odds>1)||!Number.isFinite(ev)))throw new Error('VALUE contract invalid: '+id);
              if(String(r.validation_tier||'').toUpperCase()==='OFFICIAL_ML'&&value&&x.verdict==='NO BET')throw new Error('official market bypasses NO BET: '+id);
            }
          }
          console.log(JSON.stringify({ok:true,model:q.meta?.model_version,events:q.upcoming.length,radar:q.radar.length,resolvedRadar,coverage:coverage==null?null:+coverage.toFixed(3),marketChecked:q.meta?.market_checked||0,processed:q.meta?.processed_this_run||0,pending:q.meta?.pending_prediction_batch||0,marketStats:q.market_stats?.settled||0}));
          NODE
      - name: Commit state
        if: steps.scheduler.outputs.run_quant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Quant engine patches stay runtime-only; Player Lab UI and board state are persisted.
          git restore --worktree -- quant-engine.mjs
          git config user.name "tennis-zero-cost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant-board.json index.html
          if git diff --cached --quiet; then echo "No v12.4.1 changes"; exit 0; fi
          git commit -m "quant: v12.4.1 auto-recovery refresh"
          git pull --rebase
          git push
      - name: Scheduler summary
        if: always()
        shell: bash
        env:
          RUN_QUANT: ${{ steps.scheduler.outputs.run_quant }}
          SCHEDULER_ROLE: ${{ steps.scheduler.outputs.role }}
          SCHEDULER_REASON: ${{ steps.scheduler.outputs.reason }}
        run: |
          echo "run_quant=${RUN_QUANT:-unknown}"
          echo "role=${SCHEDULER_ROLE:-unknown}"
          echo "reason=${SCHEDULER_REASON:-unknown}"
          if [ "${RUN_QUANT:-false}" = "false" ]; then echo "Freshness gate: no duplicate API run needed."; fi

