            };
          }
          function publicPlayerIntel(p,name,tour,surface){
            return{
              name,tour:String(tour||'').toUpperCase(),target_surface:surface||null,rank:p.rank??null,
              sample:{matches:p.n??0,stat_matches:p.statN??0,surface_matches:p.surfaceN??0,prop_matches:p.propN??0},
              context:{form:p.form??null,form_long:p.form_long??null,surface_form:p.surface??null,last_surface:p.last_surface??null,rest_days:p.last_match_days??null,matches_7d:p.matches7??0,matches_14d:p.matches14??0,workload_7d_minutes:p.workload7??0,workload_14d_minutes:p.workload14??0},
              service:{first_serve_pct:p.first_serve_pct??null,first_serve_points_won:p.first_serve_points_won??null,second_serve_points_won:p.second_serve_points_won??null,service_points_won:p.service_points_won??null,service_games_won:p.service_games_won??null,break_points_saved:p.break_points_saved??null,aces_per_match:p.aces_pg??null,double_faults_per_match:p.double_faults_pg??null},
              return:{first_return_points_won:p.first_return_points_won??null,second_return_points_won:p.second_return_points_won??null,return_points_won:p.return_points_won??null,return_games_won:p.return_games_won??null,break_points_converted:p.break_points_converted??null,breaks_per_match:p.breaks_pg??null,aces_allowed_per_match:p.aces_allowed_pg??null},
              recent_matches:p.recent_matches||[],verification:verificationLinks(tour),
              history_source:USING_CUSTOM_HISTORY?'CUSTOM_LICENSED_HISTORY':'TENNIS_HISTORY_ARCHIVE_RESEARCH',
              verification_note:'Statistiche calcolate dallo storico match del motore; link ufficiali ATP/WTA e SofaScore per controllo esterno. Nessun dato viene inventato se il campione non e disponibile.'
            };
          }
          `,
            'metricsFast/player intelligence'
          );

          mustReplace(
            '    market_lab:marketLab,market_best:marketLab.best_priced,multi_market_version:"MM-3.0-PRICE-GUARD",',
            `    player_intel:{candidate_side:candidateSide,candidate_name:candidateName,a:publicPlayerIntel(c.A,event.home,c.tour,c.surface),b:publicPlayerIntel(c.B,event.away,c.tour,c.surface)},
              market_lab:marketLab,market_best:marketLab.best_priced,multi_market_version:"MM-3.0-PRICE-GUARD",`,
            'prediction player_intel payload'
          );
          fs.writeFileSync(qp,src);

          // UI: Player Lab is persisted in index.html. It is idempotent on later runs.
          let html=fs.readFileSync(hp,'utf8');
          const marker='TEP-12.4-PLAYER-INTEL';
          if(!html.includes(marker)){
            const css=`\n/* ${marker} */\n.playerIntel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.intelCompare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.intelPlayer{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(9,22,34,.72)}.intelPlayer.chosen{border-color:rgba(53,195,125,.58);box-shadow:inset 0 0 0 1px rgba(53,195,125,.12)}.intelHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}.intelHead b{font-size:12px}.intelRole{font-size:7px;font-weight:900;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.intelRole.chosen{color:var(--green);border-color:rgba(53,195,125,.5)}.intelGroup{margin-top:8px}.intelGroup h4{margin:0 0 5px;font-size:8px;color:var(--soft);text-transform:uppercase;letter-spacing:.09em}.intelStats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.intelStat{border:1px solid rgba(100,130,160,.18);border-radius:9px;padding:6px;min-width:0}.intelStat b{display:block;font-size:9px}.intelStat span{display:block;font-size:6.5px;color:var(--muted);margin-top:2px;line-height:1.2}.intelHistory{margin-top:8px}.intelHistory summary{font-size:8px;color:var(--muted);cursor:pointer;font-weight:850}.intelMatch{display:grid;grid-template-columns:42px 1fr 62px 62px;gap:6px;align-items:center;border-top:1px solid rgba(100,130,160,.14);padding:6px 0;font-size:7px}.intelMatch b{font-size:8px}.intelMatch .win{color:var(--green)}.intelMatch .loss{color:var(--red)}.intelSources{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.intelLink{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 7px;color:var(--soft);text-decoration:none;font-size:7px;font-weight:800}.intelFoot{font-size:6.5px;color:var(--muted);margin-top:6px;line-height:1.35}@media(max-width:760px){.intelCompare{grid-template-columns:1fr}.intelStats{grid-template-columns:repeat(3,1fr)}.intelMatch{grid-template-columns:38px 1fr 55px}}\n`;
            if(!html.includes('</style>'))throw new Error('V12.4 UI style target missing');
            html=html.replace('</style>',css+'</style>');

            const js=Buffer.from('','base64').toString('utf8');
            const fn='function renderMatches(){';
            if(!html.includes(fn))throw new Error('V12.4 UI render target missing');
            html=html.replace(fn,js+fn);
            const a=html.indexOf(fn),b=html.indexOf('function renderRecord(){',a);
            if(a<0||b<0)throw new Error('V12.4 UI render block missing');
            let block=html.slice(a,b);
            const old='</div></details></div></article>`}).join(\'\')';
            const neu='</div></details>${playerIntelHtml(x)}</div></article>`}).join(\'\')';
            if(!block.includes(old))throw new Error('V12.4 UI insert point missing');
            block=block.replace(old,neu);
            html=html.slice(0,a)+block+html.slice(b);
            fs.writeFileSync(hp,html);
          }
          console.log(JSON.stringify({ok:true,patch:'V12.4-PLAYER-INTEL',modelWeights:'UNCHANGED',historyMatches:12,ui:'Player Lab',verificationLinks:['ATP/WTA','SofaScore']}));
          NODE
      - name: Engine syntax and self-tests
        if: steps.scheduler.outputs.run_quant == 'true'
        run: |
          node --check quant-engine.mjs
          node --check live-engine.mjs
          node quant-engine.mjs --self-test
          node live-engine.mjs --self-test
      - name: Betting Intelligence contract
        if: steps.scheduler.outputs.run_quant == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const inline=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).join('\n');
          const external=[...html.matchAll(/<script[^>]+src=["']([^"']+)["'][^>]*>/gi)]
            .map(x=>x[1]).filter(x=>!/^https?:/i.test(x)&&fs.existsSync(x)).map(x=>fs.readFileSync(x,'utf8')).join('\n');
          const code=`${inline}\n${external}`;
          new Function(code);
          const htmlReq=['Tennis Edge Pro 12','TEP-12.4-PLAYER-INTEL','Player Lab','id="bestBets"','id="edgeDial"','id="marketTape"','id="marketMatrix"','id="marketFamilyTabs"','id="sharpScanner"','id="priceAlerts"','id="oddsFormatBtn"','id="liveGrid"','id="matchList"','id="matchSearch"','id="dataHealthGrid"','id="similarityLab"','id="recordTable"','id="performanceBreakdown"','id="smartSlip"','id="localLedger"','id="anomalyGuide"'];
          const jsReq=['TEP-12.0-MARKET-LEADER','function validateBoard','function renderHero','function renderBestBets','function renderMarketTape','function renderMarketMatrix','function renderScanner','function renderAlerts','function renderLive','function renderMatches','function renderRecord','function renderPerformance','function renderBankroll','function renderLedger','function renderDataHealth','function renderSimilarity','function probabilityBand','function similarMatchesFor','function operationalSafe','function guardMeaning','function landOnSection','const rowHasBlockingAnomaly','const decimalOdds','const marketFamily','const minOdds','function offersFor'];
          const miss=[...htmlReq.filter(x=>!html.includes(x)),...jsReq.filter(x=>!code.includes(x))];
          if(miss.length)throw new Error('Betting Intelligence contract missing: '+miss.join(', '));
          const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const dup=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
          if(dup.length)throw new Error('Duplicate IDs: '+dup.join(', '));
          console.log(JSON.stringify({ok:true,version:'TEP-12.0-MARKET-LEADER',ids:ids.length}));
          NODE
      - name: Run Quant Engine
        if: steps.scheduler.outputs.run_quant == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COMMERCIAL_MODE: ${{ vars.COMMERCIAL_MODE }}
          COMMERCIAL_ODDS_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_ODDS_LICENSE_CONFIRMED }}
          COMMERCIAL_HISTORY_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_HISTORY_LICENSE_CONFIRMED }}
