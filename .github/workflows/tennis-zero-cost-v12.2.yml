name: Tennis Edge Pro 12.2 Anti Rate Limit Quant Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: write

concurrency:
  group: tennis-edge-pro-quant
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Apply V12.2 anti-rate-limit patch
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='quant-engine.mjs';
          let src=fs.readFileSync(p,'utf8');

          function replaceBetween(start,end,replacement,label){
            const a=src.indexOf(start),b=src.indexOf(end,a+start.length);
            if(a<0||b<0)throw new Error(`V12.2 patch target missing: ${label}`);
            src=src.slice(0,a)+replacement+'\n'+src.slice(b);
          }
          function mustReplace(oldText,newText,label){
            if(!src.includes(oldText))throw new Error(`V12.2 patch target missing: ${label}`);
            src=src.replace(oldText,newText);
          }

          // 1) Version + tighter per-run budget. The daily guard remains unchanged.
          mustReplace('const MODEL_VERSION="TENNIS-EDGE-QUANT-12.1-COLD-START";',
                      'const MODEL_VERSION="TENNIS-EDGE-QUANT-12.2-ANTI-RATE-LIMIT";',
                      'model version');
          src=src.replace(/const RUN_CAP=\d+;/,'const RUN_CAP=10;');
          src=src.replace(/const QUOTE_REFRESH_LIMIT=\d+;/,'const QUOTE_REFRESH_LIMIT=10;');

          // 2) A reset timestamp alone does NOT mean the quota is exhausted.
          //    Pause only after HTTP 429 or when remaining is explicitly <= 0.
          replaceBetween(
            'function rateLimitActive(){',
            'function rateLimitLabel(){',
          `function rateLimitActive(){
            const rl=state?.rate_limit||{};
            const reset=rl.reset_at;
            const remaining=Number(rl.remaining);
            const exhausted=rl.last_status===429||(Number.isFinite(remaining)&&remaining<=0);
            return !!(exhausted&&reset&&new Date(reset)>NOW);
          }`,
            'rateLimitActive'
          );

          // 3) Multi-odds is progressive: keep partial good data instead of aborting
          //    the entire Quant Board when the last batch reaches the quota.
          replaceBetween(
            'async function multiOdds(ids,bookmakers){',
            'function freshOffers(event,p,mkt){',
          `async function multiOdds(ids,bookmakers){
            const out=new Map();
            for(let i=0;i<ids.length;i+=10){
              const batch=ids.slice(i,i+10);
              const params={eventIds:batch.join(","),bookmakers:bookmakers.join(",")};if(MARKET_QUERY)params.markets=MARKET_QUERY;
              try{
                const raw=await api("/odds/multi",params);
                for(const [k,v] of mapMultiOdds(raw))out.set(k,v);
              }catch(e){
                if(["RATE_LIMIT_WAIT","RATE_LIMIT_429","RUN_BUDGET_GUARD","DAILY_BUDGET_GUARD"].includes(e.message)){
                  console.warn("multiOdds pause",e.message,"events",out.size);
                  break;
                }
                throw e;
              }
            }
            return out;
          }`,
            'multiOdds'
          );

          // 4) Cache the selected bookmakers for 24h: they do not need an API call every run.
          replaceBetween(
            '  let bookmakers=[];',
            '  await settlePredictions(bookmakers);',
          `  let bookmakers=[];
            try{
              state.cache=state.cache||{};
              const cachedNames=selectedNames(state.cache?.bookmakers?.names||state.meta?.bookmakers||[]);
              const fetchedMs=new Date(state.cache?.bookmakers?.fetched_at||0).getTime();
              const cacheFresh=cachedNames.length&&Number.isFinite(fetchedMs)&&(NOW.getTime()-fetchedMs<24*3600000);
              if(cacheFresh){
                bookmakers=cachedNames;
              }else if(cachedNames.length&&!state.cache?.bookmakers?.fetched_at){
                bookmakers=cachedNames;
                state.cache.bookmakers={names:bookmakers,fetched_at:NOW.toISOString()};
              }else{
                bookmakers=selectedNames(await api("/bookmakers/selected"));
                if(bookmakers.length<1)throw new Error("NO_SELECTED_BOOKMAKERS");
                state.cache.bookmakers={names:bookmakers,fetched_at:NOW.toISOString()};
              }
            }catch(e){
              state.meta={...(state.meta||{}),updated_at:NOW.toISOString(),status:"SETUP",source:SOURCE_LABEL,model_version:MODEL_VERSION,error:e.message,api_usage_today:state.usage.calls};
              await saveState(state);return;
            }`,
            'bookmaker cache'
          );

          // 5) Settlement reuses the single /events snapshot.
          //    This removes the old /events/{id} loop that produced 404s and wasted quota.
          replaceBetween(
            'async function settlePredictions(bookmakers){',
            'function stats(history){',
          `async function settlePredictions(bookmakers,events=[]){
            const hist=[...(state.history||[])],remaining=[];
            const due=(state.upcoming||[]).filter(p=>new Date(p.start_at)<NOW).slice(0,MAX_SETTLEMENTS_PER_RUN);
            const dueIds=new Set(due.map(p=>String(p.event_id)));
            const byId=new Map((events||[]).map(e=>[String(e.id),e]));
            let closingCalls=0;
            for(const p of state.upcoming||[]){
              const id=String(p.event_id);
              if(!dueIds.has(id)){remaining.push(p);continue}
              const e=byId.get(id),actual=e?winnerSide(e):null;
              if(!e||!actual){remaining.push(p);continue}
              const won=p.pick_side?p.pick_side===actual:null,profit=p.pick_side?(won?(p.pick_odds-1):-1):0,y=actual==="A"?1:0;
              let clv=null,closingOdds=null;
              const hourly=Number.isFinite(state.rate_limit?.remaining)?state.rate_limit.remaining:RUN_CAP;
              if(p.pick_side&&bookmakers.length&&closingCalls<1&&!rateLimitActive()&&hourly>6&&runCalls<RUN_CAP-5&&state.usage.calls<DAILY_CAP-5){
                closingCalls++;
                const cm=await closingMarket(p.event_id,bookmakers);
                if(cm){closingOdds=p.pick_side==="A"?cm.bestA:cm.bestB;if(closingOdds>1)clv=p.pick_odds/closingOdds-1}
              }
              const secondary_settled=settleSecondaryMarkets(e,p);
              hist.unshift({...p,status:"SETTLED",settled_at:NOW.toISOString(),actual_side:actual,actual_winner:actual==="A"?p.player_a:p.player_b,pick_won:won,profit_units:profit,brier:(p.p_a-y)**2,log_loss:-(y*Math.log(clamp(p.p_a,.001,.999))+(1-y)*Math.log(clamp(1-p.p_a,.001,.999))),shadow_brier:Number.isFinite(p.shadow_p_a)?(p.shadow_p_a-y)**2:null,shadow_log_loss:Number.isFinite(p.shadow_p_a)?-(y*Math.log(clamp(p.shadow_p_a,.001,.999))+(1-y)*Math.log(clamp(1-p.shadow_p_a,.001,.999))):null,closing_odds:closingOdds,clv,secondary_settled});
            }
            state.history=hist.slice(0,4000);state.upcoming=remaining;
          }`,
            'settlePredictions'
          );

          // Remove the old later /events fetch, then fetch once BEFORE settlement and reuse it.
          const eventFetch=`  let eventsRaw=await api("/events",{sport:"tennis"});
            const events=(Array.isArray(eventsRaw)?eventsRaw:(eventsRaw?.data||eventsRaw?.events||[])).filter(isSinglesEvent);
          `;
          if(!src.includes(eventFetch))throw new Error('V12.2 patch target missing: events fetch');
          src=src.replace(eventFetch,'');
          mustReplace(
            '  await settlePredictions(bookmakers);\n',
          `  let eventsRaw=await api("/events",{sport:"tennis"});
            const events=(Array.isArray(eventsRaw)?eventsRaw:(eventsRaw?.data||eventsRaw?.events||[])).filter(isSinglesEvent);
            await settlePredictions(bookmakers,events);
          `,
            'main settlement reuse'
          );

          fs.writeFileSync(p,src);
          console.log(JSON.stringify({
            ok:true,
            patch:"V12.2-ANTI-RATE-LIMIT",
            runCap:10,
            quoteRefreshLimit:10,
            settlement:"shared-events-snapshot",
            bookmakerCache:"24h",
            progressiveOdds:true
          }));
          NODE
      - name: Engine syntax and self-tests
        run: |
          node --check quant-engine.mjs
          node --check live-engine.mjs
          node quant-engine.mjs --self-test
          node live-engine.mjs --self-test
      - name: Betting Intelligence contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const inline=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).join('\n');
          const external=[...html.matchAll(/<script[^>]+src=["']([^"']+)["'][^>]*>/gi)]
            .map(x=>x[1]).filter(x=>!/^https?:/i.test(x)&&fs.existsSync(x)).map(x=>fs.readFileSync(x,'utf8')).join('\n');
          const code=`${inline}\n${external}`;
          new Function(code);
          const htmlReq=['Tennis Edge Pro 12','id="bestBets"','id="edgeDial"','id="marketTape"','id="marketMatrix"','id="marketFamilyTabs"','id="sharpScanner"','id="priceAlerts"','id="oddsFormatBtn"','id="liveGrid"','id="matchList"','id="matchSearch"','id="dataHealthGrid"','id="similarityLab"','id="recordTable"','id="performanceBreakdown"','id="smartSlip"','id="localLedger"','id="anomalyGuide"'];
          const jsReq=['TEP-12.0-MARKET-LEADER','function validateBoard','function renderHero','function renderBestBets','function renderMarketTape','function renderMarketMatrix','function renderScanner','function renderAlerts','function renderLive','function renderMatches','function renderRecord','function renderPerformance','function renderBankroll','function renderLedger','function renderDataHealth','function renderSimilarity','function probabilityBand','function similarMatchesFor','function operationalSafe','function guardMeaning','function landOnSection','const rowHasBlockingAnomaly','const decimalOdds','const marketFamily','const minOdds','function offersFor'];
          const miss=[...htmlReq.filter(x=>!html.includes(x)),...jsReq.filter(x=>!code.includes(x))];
          if(miss.length)throw new Error('Betting Intelligence contract missing: '+miss.join(', '));
          const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const dup=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
          if(dup.length)throw new Error('Duplicate IDs: '+dup.join(', '));
          console.log(JSON.stringify({ok:true,version:'TEP-12.0-MARKET-LEADER',ids:ids.length}));
          NODE
      - name: Run Quant Engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          COMMERCIAL_MODE: ${{ vars.COMMERCIAL_MODE }}
          COMMERCIAL_ODDS_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_ODDS_LICENSE_CONFIRMED }}
          COMMERCIAL_HISTORY_LICENSE_CONFIRMED: ${{ vars.COMMERCIAL_HISTORY_LICENSE_CONFIRMED }}
          ATP_HISTORY_URL_TEMPLATE: ${{ vars.ATP_HISTORY_URL_TEMPLATE }}
          WTA_HISTORY_URL_TEMPLATE: ${{ vars.WTA_HISTORY_URL_TEMPLATE }}
        run: node quant-engine.mjs
      - name: Quant Board fail-closed validation
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),p='data/quant-board.json';
          if(!fs.existsSync(p))throw new Error('quant board missing');
          const q=JSON.parse(fs.readFileSync(p));
          for(const k of ['upcoming','radar','history'])if(!Array.isArray(q[k]))throw new Error(k+' invalid');
          if(!Number.isFinite(new Date(q.meta?.updated_at).getTime()))throw new Error('updated_at invalid');
          const ids=new Set();
          const decimalOdds=v=>{if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return Number.isFinite(v)&&v>1?v:null;const s=String(v).trim();if(/^\+\d+(?:\.\d+)?$/.test(s))return 1+Number(s.slice(1))/100;if(/^-\d+(?:\.\d+)?$/.test(s))return 1+100/Math.abs(Number(s));if(/^\d+(?:\.\d+)?\/\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b>0?1+a/b:null}const x=Number(s);return Number.isFinite(x)&&x>1?x:null};
          for(const x of q.upcoming){
            const id=String(x.event_id||'');
            if(!id||ids.has(id))throw new Error('event id missing/duplicate: '+id);
            ids.add(id);
            if(!x.player_a||!x.player_b)throw new Error('players missing: '+id);
            const rows=x.market_live?.rows?.length?x.market_live.rows:(x.market_lab?.priced||[]);
            for(const r of rows){
              const value=['VALUE','STRONG VALUE'].includes(String(r.verdict||'').toUpperCase());
              const prob=Number(r.robust_prob??r.model_prob??r.pick_prob);
              const odds=decimalOdds(r.current_odds??r.best_odds??r.pick_odds);
              const ev=Number(r.current_robust_ev??r.robust_ev??r.current_ev??r.pick_ev);
              if(value&&(!(prob>0&&prob<1)||!(odds>1)||!Number.isFinite(ev)))throw new Error('VALUE contract invalid: '+id);
              if(String(r.validation_tier||'').toUpperCase()==='OFFICIAL_ML'&&value&&x.verdict==='NO BET')throw new Error('official market bypasses NO BET: '+id);
            }
          }
          console.log(JSON.stringify({ok:true,model:q.meta?.model_version,events:q.upcoming.length,marketStats:q.market_stats?.settled||0}));
          NODE
      - name: Commit state
        shell: bash
        run: |
          if git diff --quiet -- data/quant-board.json; then echo "No quant changes"; exit 0; fi
          git config user.name "tennis-zero-cost-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant-board.json
          git commit -m "quant: v12 market leader refresh"
          git pull --rebase
          git push
