name: V15 Mobile Quality Gate
on:
  pull_request:
    paths: ['index.html','premium-shell-v1.js','tests/mobile-contract-v15.test.cjs','.github/workflows/v15-mobile-quality-gate.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/mobile-contract-v15.test.cjs
      - run: node --test tests/*.test.cjs
      - run: node --test tests/*.test.cjs
      - run: node --check premium-shell-v1.js
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ios
        run: xcodegen generate
      - working-directory: ios
        run: xcodebuild -project TennisEdge.xcodeproj -scheme TennisEdge -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO clean build
