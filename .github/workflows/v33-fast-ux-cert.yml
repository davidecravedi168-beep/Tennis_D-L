name: V3.4 Fast UX Certifier

on:
  push:
    branches: [fix/v33-fast-nav-photo-coverage]
    paths:
      - '.github/workflows/v33-fast-ux-cert.yml'
      - 'scripts/apply-v34-ux.mjs'
      - 'scripts/build-player-photo-catalog.mjs'
      - 'premium-shell-v1.js'
      - 'player-photos.js'
      - 'index.html'
      - 'manifest.webmanifest'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v34-fast-ux-certifier
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/v33-fast-nav-photo-coverage
          fetch-depth: 0

      - name: Build V3.4 candidate
        run: |
          set -euo pipefail
          node scripts/apply-v34-ux.mjs
          node scripts/build-player-photo-catalog.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'premium-shell-v1\.js\?v=[^"\']+', 'premium-shell-v1.js?v=20260911-v34-instant-portraits', s)
          s=re.sub(r'\s*<script src="player-photos\.js\?v=[^"]+"></script>\s*', '\n', s)
          photo='<script src="player-photos.js?v=20260911-v34"></script>'
          premium='<script src="premium-shell-v1.js?v=20260911-v34-instant-portraits"></script>'
          if premium not in s: raise SystemExit('V34_PREMIUM_TAG_MISSING')
          s=s.replace(premium, photo+'\n'+premium)
          s=s.replace("connect-src 'self' https://en.wikipedia.org;","connect-src 'self' https://en.wikipedia.org https://www.wikidata.org;")
          p.write_text(s,encoding='utf-8')
          m=Path('manifest.webmanifest')
          ms=m.read_text(encoding='utf-8')
          ms=re.sub(r'"start_url"\s*:\s*"\.\/\?v=[^"]+"','"start_url": "./?v=20260911-v34-instant-portraits"',ms)
          m.write_text(ms,encoding='utf-8')
          PY

      - name: Static contracts and portrait coverage
        run: |
          set -euo pipefail
          node --check premium-shell-v1.js
          node --check player-photos.js
          grep -Fq "TEP_FULL_PREMIUM_UI_V3_4" premium-shell-v1.js
          grep -Fq 'function catalogPhoto(raw)' premium-shell-v1.js
          grep -Fq "root.addEventListener('pointerdown'" premium-shell-v1.js
          ! grep -Fq 'document.startViewTransition' premium-shell-v1.js
          grep -Fq '<span>Partite</span>' premium-shell-v1.js
          grep -Fq '<span>Salvati</span>' premium-shell-v1.js
          grep -Fq 'player-photos.js?v=20260911-v34' index.html
          grep -Fq 'premium-shell-v1.js?v=20260911-v34-instant-portraits' index.html
          grep -Fq '"start_url": "./?v=20260911-v34-instant-portraits"' manifest.webmanifest
          test "$(grep -o 'player-photos.js?v=20260911-v34' index.html | wc -l)" -eq 1
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const b=JSON.parse(fs.readFileSync('data/quant-board.json','utf8'));
          const box={window:{}};vm.runInNewContext(fs.readFileSync('player-photos.js','utf8'),box);
          const cat=box.window.__TEP_PLAYER_PHOTOS__||{};
          if(!Object.keys(cat).length)throw new Error('EMPTY_PHOTO_CATALOG');
          const xs=Array.isArray(b.upcoming)?b.upcoming:[];
          if(!xs.length)throw new Error('NO_UPCOMING_FOR_UI');
          const n=v=>Number.isFinite(Number(v))?Number(v):0;
          const hero=[...xs].sort((a,c)=>n(c.priority)-n(a.priority)||n(c.data_quality)-n(a.data_quality))[0];
          const pretty=raw=>{const s=String(raw||'').trim();if(s.includes(',')){const [last,...rest]=s.split(',');return `${rest.join(',').trim()} ${last.trim()}`.trim()}return s};
          const names=[pretty(hero.player_a),pretty(hero.player_b)],covered=names.filter(x=>cat[x.toLowerCase()]);
          console.log('PHOTO_CATALOG_COUNT='+Object.keys(cat).length,'HERO='+names.join(' vs '),'COVERED='+covered.join('|'));
          if(covered.length<1)throw new Error('HERO_PORTRAIT_NOT_PREBUILT');
          NODE
          echo 'V34_STATIC=PASS'

      - name: Real browser rendered-pixel and navigation probe
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo CHROME_NOT_FOUND; exit 1; }
          cat > ux-probe.html <<'HTML'
          <!doctype html><meta charset="utf-8"><div id="portrait">PORTRAIT_WAIT</div><div id="nav">NAV_WAIT</div><iframe id="app" style="width:390px;height:844px"></iframe><script>
          const f=document.getElementById('app'),po=document.getElementById('portrait'),no=document.getElementById('nav');
          f.src='./?v=20260911-v34-instant-portraits';
          f.onload=()=>{
            const started=performance.now();
            const wait=()=>{
              const w=f.contentWindow,d=f.contentDocument;
              const app=d.querySelector('#tpApp[data-version="TEP_FULL_PREMIUM_UI_V3_4"]');
              const imgs=[...d.querySelectorAll('.tp-avatar.hero img')];
              const good=imgs.find(x=>x.complete&&x.naturalWidth>40&&x.naturalHeight>40&&x.closest('.tp-avatar')?.classList.contains('has-photo'));
              if(!app||!good){
                if(performance.now()-started<10000)return setTimeout(wait,80);
                po.textContent=`PORTRAIT_FAIL app=${!!app} imgs=${imgs.length} widths=${imgs.map(x=>x.naturalWidth).join(',')}`;
                return;
              }
              po.textContent=`PORTRAIT_PASS ${good.naturalWidth}x${good.naturalHeight}`;
              const b=d.querySelector('.tp-nav [data-route="explore"]');
              if(!b){no.textContent='NAV_FAIL no-button';return}
              const t=performance.now();
              b.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',isPrimary:true}));
              requestAnimationFrame(()=>{
                const title=d.querySelector('.tp-page-title h1')?.textContent?.trim(),ms=performance.now()-t;
                no.textContent=title==='Partite'&&ms<150?`NAV_PASS ${ms.toFixed(1)}ms`:`NAV_FAIL ${title} ${ms.toFixed(1)}ms`;
              });
            };wait();
          };
          </script>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v34-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..40}; do if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then READY=1; break; fi; sleep .25; done
          test "$READY" -eq 1 || { cat /tmp/v34-http.log; exit 1; }
          timeout 65s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom 'http://127.0.0.1:8765/ux-probe.html' >/tmp/ux-probe-dom.html
          grep -o 'PORTRAIT_[A-Z]*[^<]*' /tmp/ux-probe-dom.html | tail -2 || true
          grep -o 'NAV_[A-Z]*[^<]*' /tmp/ux-probe-dom.html | tail -2 || true
          grep -Fq 'PORTRAIT_PASS' /tmp/ux-probe-dom.html
          grep -Fq 'NAV_PASS' /tmp/ux-probe-dom.html
          echo 'V34_REAL_BROWSER_UX=PASS'

      - name: Existing quant regressions
        run: |
          set -euo pipefail
          node scripts/tennis-model-diagnostics-v2.mjs --self-test
          node scripts/drift-controller-v6.mjs --self-test
          node scripts/clv-tracker-v3.mjs --self-test
          node scripts/clv-diagnostics-fix-v3.mjs --self-test

      - name: Commit certified candidate
        run: |
          set -euo pipefail
          rm -f ux-probe.html
          if git diff --quiet -- premium-shell-v1.js player-photos.js index.html manifest.webmanifest; then
            echo 'Candidate already persisted.'
            exit 0
          fi
          git config user.name 'tennis-edge-v34-certifier'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add premium-shell-v1.js player-photos.js index.html manifest.webmanifest
          git commit -m 'feat(ui): V3.4 instant navigation and verified portraits'
          git pull --rebase origin fix/v33-fast-nav-photo-coverage
          git push origin HEAD:fix/v33-fast-nav-photo-coverage
