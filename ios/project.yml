name: TennisEdge
options:
  bundleIdPrefix: it.tennisedge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TennisEdge:
    type: application
    platform: iOS
    sources:
      - path: TennisEdge
        excludes:
          - PrivacyInfo.xcprivacy
    resources:
      - path: TennisEdge/PrivacyInfo.xcprivacy
    info:
      path: TennisEdge/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tennisedge.pro
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
